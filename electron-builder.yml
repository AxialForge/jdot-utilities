appId: com.jdot.utilities
productName: Jdot Utilities
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - build/icon.ico # also bundled so the runtime BrowserWindow icon resolves
  - "!**/*.map"

# sharp ships native binaries that can't run from inside the asar archive,
# so they must be unpacked. (electron-builder bundles production node_modules
# automatically; dev dependencies are excluded.)
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  # @napi-rs/canvas ships a prebuilt .node (PDF -> Images rendering); like sharp
  # it can't be loaded from inside the asar archive.
  - "**/node_modules/@napi-rs/**"
  # tesseract.js loads a wasm core and spawns a worker script from disk (OCR);
  # both must live outside the asar to resolve.
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"

extraResources:
  # OCR English model (offline — no CDN fetch). ocr.js reads it from resources/tessdata.
  - from: resources/tessdata
    to: tessdata
  # Bundled sidecar binaries, resolved at runtime from process.resourcesPath/bin:
  #   pandoc.exe   — Documents & Ebooks converter (pandoc.js)
  #   gswin64c.exe — optional Ghostscript for Compress / PDF-A (gs.js), if added
  # CI fetches pandoc into resources/bin before the build (see build.yml); the
  # 222 MB binary is never committed (resources/bin/.gitignore).
  - from: resources/bin
    to: bin

# To also bundle Ghostscript (so Compress / PDF-A needs no separate install),
# drop gswin64c.exe + its DLLs into resources/bin/ — gs.js already looks there.

# Where the updater looks for new versions. electron-builder also uses this to
# generate `latest.yml` (the version + SHA-512 manifest the updater reads) into
# dist/ at build time; CI uploads it alongside the .exe. This does NOT make the
# app phone home — the update check only runs when the user clicks it.
publish:
  provider: github
  owner: AxialForge
  repo: jdot-utilities

win:
  target:
    # NSIS is the updatable target (the portable .exe can't self-update — it has
    # nothing installed to replace). The updater is a no-op in the portable build.
    - nsis
    - portable
  # Place a 256x256+ icon at build/icon.ico. If absent, electron-builder uses a default.
  icon: build/icon.ico

# Space-free artifact names. With a space, the on-disk file, the URL written into
# latest.yml (which uses hyphens), and the GitHub asset name (spaces become dots
# on upload) all disagree — so the updater's download URL would 404. Using ${name}
# (jdot-utilities) keeps all three identical.
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Jdot Utilities

portable:
  artifactName: ${name}-${version}-portable.${ext}
